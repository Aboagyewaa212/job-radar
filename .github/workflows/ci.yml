name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Use npm 12 for lockfile regeneration
        run: npm install --global npm@12.0.2
      - name: Regenerate dependencies and lockfile
        run: rm -f package-lock.json && npm install
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Typecheck, tests, and production build
        run: npm run check
      - name: Capture patched lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
