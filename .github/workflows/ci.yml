name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Use npm 12 for lockfile regeneration
        run: npm install --global npm@12.0.2
      - name: Regenerate dependencies and lockfile
        run: rm -f package-lock.json && npm install
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Typecheck, tests, and production build
        run: npm run check
      - name: Commit audited lockfile once
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit audited dependency lockfile"
          git push origin HEAD:develop
